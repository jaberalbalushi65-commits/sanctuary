<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sanctuary</title><style>*{box-sizing:border-box}body{background:#0b1018;color:#c5dced;font:16px system-ui;margin:auto;max-width:760px;padding:22px}h1,h2{font-family:Georgia;font-weight:normal}h1{text-align:center;letter-spacing:5px}p{line-height:1.5}button,input,select,textarea{font:inherit;color:inherit;background:#192535;border:1px solid #536b80;border-radius:10px;padding:10px;margin:4px 0;max-width:100%}input,textarea{width:100%}button{cursor:pointer}section{border:1px solid #384b60;border-radius:18px;padding:18px;margin:16px 0;background:#121b28}nav{display:flex;flex-wrap:wrap;gap:6px}svg{width:100%;max-height:420px}small{color:#a4b5c9}.person{display:flex;align-items:center;gap:12px;width:100%;text-align:left}.person span{flex:1;overflow-wrap:anywhere} [hidden]{display:none!important}#msg{color:#efb5a8}textarea{min-height:110px}</style><h1>☾ SANCTUARY</h1><p style="text-align:center">The Black Heart System</p><div id="msg" role="status"></div><section id="gate"><h2 id="gateTitle">Private sanctuary</h2><input id="pw" type="password" placeholder="Password (10+ characters)"><input id="confirm" type="password" placeholder="Confirm password"><button id="enter">Open vault</button><p>Encrypted local storage. No password recovery.</p><label>Restore backup <input id="restore" type="file" accept=".json,application/json"></label></section><main id="main" hidden><button id="lock">Lock vault</button><nav id="nav"></nav><section id="view"></section></main><script>
'use strict';const $=id=>document.getElementById(id),store='sanctuary-v3-encrypted',enc=new TextEncoder(),dec=new TextDecoder(),b64=a=>btoa(String.fromCharCode(...a)),bytes=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));let data,key,salt,tab='Sanctuary',selected=null,queue=Promise.resolve();const colors=['🤍','🩶','🖤','❤️','🩵','💜','💙','💚','💛','🧡','🤎'];const moods=['Happy','Neutral','Mad'];const fresh=()=>({wall:1,people:[],laws:'No Black Heart is allowed to disturb my peace.',journal:'',history:[]});function msg(s){$('msg').textContent=s}async function derive(p,s){return crypto.subtle.deriveKey({name:'PBKDF2',salt:s,iterations:600000,hash:'SHA-256'},await crypto.subtle.importKey('raw',enc.encode(p),'PBKDF2',false,['deriveKey']),{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}async function seal(d,k,s){let iv=crypto.getRandomValues(new Uint8Array(12)),ct=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},k,enc.encode(JSON.stringify(d))));return JSON.stringify({version:3,salt:b64(s),iv:b64(iv),cipher:b64(ct)})}async function open(raw,p){let v=JSON.parse(raw);if(v.version!==3)throw Error('This backup is not a version 3 backup.');let s=bytes(v.salt),k=await derive(p,s),d=JSON.parse(dec.decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:bytes(v.iv)},k,bytes(v.cipher))));if(!Array.isArray(d.people)||!Array.isArray(d.history))throw Error('Invalid backup');return {d,k,s}}function save(note){if(note)data.history.unshift(new Date().toLocaleString()+' — '+note);let snapshot=structuredClone(data),k=key,s=salt;queue=queue.catch(()=>{}).then(async()=>localStorage.setItem(store,await seal(snapshot,k,s))).catch(e=>{msg('Save failed: '+e.message);throw e});queue.catch(()=>{});return queue}function gate(){let exists=!!localStorage.getItem(store);$('gateTitle').textContent=exists?'Unlock sanctuary':'Create private sanctuary';$('confirm').hidden=exists;$('enter').textContent=exists?'Unlock vault':'Create vault'}function show(){ $('gate').hidden=true;$('main').hidden=false;$('pw').value=$('confirm').value='';msg('');render()}$('enter').onclick=async()=>{try{let p=$('pw').value,raw=localStorage.getItem(store);if(raw){let r=await open(raw,p);data=r.d;key=r.k;salt=r.s}else{if(p.length<10||p!==$('confirm').value)throw Error('Use matching passwords of at least 10 characters.');salt=crypto.getRandomValues(new Uint8Array(16));key=await derive(p,salt);data=fresh();await save()}show()}catch(e){msg('Could not open vault: '+e.message)}};$('lock').onclick=async()=>{try{await queue;data=key=salt=null;$('view').replaceChildren();$('main').hidden=true;$('gate').hidden=false;gate()}catch(e){msg('Save failed; vault remains open.')}};$('restore').onchange=async e=>{try{let f=e.target.files[0];if(!f)return;let p=$('pw').value;if(!p)throw Error('Enter the backup password first, then choose the file again.');let raw=await f.text(),r=await open(raw,p);if(localStorage.getItem(store)&&!window.confirm('Replace current version 3 vault?'))return;localStorage.setItem(store,raw);data=r.d;key=r.k;salt=r.s;show()}catch(e){msg(e.message)}finally{e.target.value=''}};function el(tag,text,parent){let e=document.createElement(tag);if(text!==undefined)e.textContent=text;if(parent)parent.append(e);return e}function btn(t,f,p){let b=el('button',t,p);b.onclick=f;return b}function change(note){save(note);render()}function svgEl(tag,attrs,parent,text){let e=document.createElementNS('http://www.w3.org/2000/svg',tag);for(let k in attrs)e.setAttribute(k,attrs[k]);if(text)e.textContent=text;parent.append(e);return e}function render(){let n=$('nav'),v=$('view');n.replaceChildren();v.replaceChildren();for(let t of ['Sanctuary','Hearts','Laws','Journal','History','Backup'])btn(t,()=>{tab=t;selected=null;render()},n);if(tab==='Sanctuary'){let svg=svgEl('svg',{viewBox:'0 0 360 360'},v);for(let i=0;i<data.wall;i++)svgEl('circle',{cx:180,cy:180,r:48+i*5,fill:'none',stroke:'#91b7d2','stroke-width':1.5},svg);svgEl('text',{x:180,y:185,'font-size':43,'text-anchor':'middle'},svg,'🖤');svgEl('text',{x:180,y:205,'font-size':9,fill:'#c5dced','text-anchor':'middle'},svg,'ORIGINAL HEART');let ps=data.people.slice(0,12);ps.forEach((p,i)=>{let a=-Math.PI/2+2*Math.PI*i/ps.length,x=180+132*Math.cos(a),y=180+132*Math.sin(a),g=svgEl('g',{role:'button',tabindex:0},svg);let go=()=>{tab='Hearts';selected=p.id;render()};g.onclick=go;g.onkeydown=e=>{if(e.key==='Enter'||e.key===' ')go()};svgEl('text',{x,y,'font-size':24,'text-anchor':'middle'},g,p.heart);svgEl('text',{x,y:y+15,'font-size':10,fill:'#c5dced','text-anchor':'middle'},g,p.name.slice(0,14))});el('h2','Wall of Protection · Level '+data.wall,v);btn('−',()=>{data.wall=Math.max(1,data.wall-1);change('Wall adjusted')},v);btn('Strengthen +',()=>{data.wall=Math.min(10,data.wall+1);change('Wall adjusted')},v);el('p',data.people.filter(p=>p.heart==='🖤').length+' Black Hearts · '+data.people.filter(p=>p.warning).length+' warnings',v);el('p','They have a place in my heart, but they hold no power over my inner peace.',v);if(data.people.length>12)el('small','All people are available in Hearts.',v)}else if(tab==='Hearts'){let name=el('input',undefined,v);name.placeholder='New name';btn('Add heart',()=>{let s=name.value.trim();if(!s)return;let p={id:crypto.randomUUID(),name:s,heart:'🤍',mood:'Neutral',warning:false};data.people.push(p);selected=p.id;change('Added '+s)},v);for(let p of data.people){let b=btn(p.heart+'  '+p.name+'  ·  '+({Happy:'😊',Neutral:'😐',Mad:'😠'}[p.mood])+' '+p.mood,()=>{selected=p.id;render()},v);b.className='person';if(selected===p.id){let panel=el('section',undefined,v),inp=el('input',undefined,panel);inp.value=p.name;btn('Save name',()=>{if(inp.value.trim()){p.name=inp.value.trim();change('Renamed heart')}},panel);el('p','Heart color',panel);for(let c of colors)btn(c+(p.heart===c?' ✓':''),()=>{p.heart=c;change(p.name+' heart: '+c)},panel);el('p','How do I feel toward them?',panel);for(let m of moods)btn(({Happy:'😊',Neutral:'😐',Mad:'😠'}[m])+' '+m+(p.mood===m?' ✓':''),()=>{p.mood=m;change(p.name+' mood: '+m)},panel);el('p','Warning: '+(p.warning?'Active':'None'),panel);btn(p.warning?'Remove warning':'Issue warning',()=>{p.warning=!p.warning;change(p.name+' warning: '+p.warning)},panel);btn('Remove person',()=>{if(window.confirm('Remove '+p.name+'?')){data.people=data.people.filter(q=>q.id!==p.id);selected=null;change('Removed '+p.name)}},panel)}}}else if(tab==='Laws'||tab==='Journal'){let k=tab.toLowerCase();el('h2',tab,v);let t=el('textarea',undefined,v);t.value=data[k];btn('Save',()=>{data[k]=t.value;change(tab+' updated')},v)}else if(tab==='History'){el('h2','History',v);for(let h of data.history)el('p',h,v)}else{el('h2','Encrypted backup',v);btn('Export backup',async()=>{try{await queue;let url=URL.createObjectURL(new Blob([localStorage.getItem(store)],{type:'application/json'})),a=document.createElement('a');a.href=url;a.download='sanctuary-v3-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}catch(e){msg(e.message)}},v);el('p','To restore, lock the vault, enter the backup password and choose the backup file.',v)}}gate();</script></html>

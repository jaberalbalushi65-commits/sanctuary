<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sanctuary</title><style>body{background:#090e17;color:#c4def3;font:16px system-ui;margin:auto;max-width:650px;padding:22px}h1,h2{font-family:Georgia;font-weight:normal}h1{letter-spacing:5px;text-align:center}p{line-height:1.6}section{background:#121b28;border:1px solid #35475a;border-radius:16px;padding:18px;margin:16px 0}button,input,textarea,select{font:inherit;color:inherit;background:#192638;border:1px solid #50677d;border-radius:8px;padding:10px;margin:5px 0;box-sizing:border-box}button{cursor:pointer}textarea,input:not([type=file]){width:100%}textarea{min-height:85px}nav{display:flex;flex-wrap:wrap;gap:6px}small{color:#9aafc3} .center{text-align:center} .heart{font-size:50px} .wall{border:12px double #809bb4;border-radius:50%;width:150px;height:150px;margin:20px auto;display:grid;place-content:center;box-shadow:0 0 35px #83b7e533}label{display:block}article{border-bottom:1px solid #35475a;padding:12px 0}button.active{background:#36536c}svg{max-width:100%}</style><body><h1>☾ SANCTUARY</h1><p class="center">The Black Heart System</p><button id="lock" hidden onclick="lockVault()">Lock vault</button><nav id="nav"></nav><main id="main"></main><small>Private local vault · Records and backups are encrypted with your password. Keep backups and remember your password.</small><script>
const key='sanctuary-v2-encrypted';const initial={wall:1,hearts:[],laws:['Rarity — A Black Heart represents an exceptional connection.','Permanence — Ordinary disagreements do not remove a Black Heart.','Love beyond romance — A Black Heart need not be romantic.','Warning — Repeated damage to trust may warrant a warning.','Revocation — Extreme disrespect, dishonour or broken trust may lead to removal.','Silent demotion — Heart status is a private decision.','Inner peace — No Black Heart may disturb my inner peace.','Emotional sovereignty — They have a place in my heart, but they hold no power over my inner peace. I am in control.'],journal:[],history:[]};let s, cryptoKey, salt, queue=Promise.resolve(); const enc=new TextEncoder(), dec=new TextDecoder(); const b64=a=>btoa(String.fromCharCode(...new Uint8Array(a))); const un64=x=>Uint8Array.from(atob(x),c=>c.charCodeAt(0));
async function derive(password,salt){let k=await crypto.subtle.importKey('raw',enc.encode(password),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:600000,hash:'SHA-256'},k,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
async function seal(data,k,sa){let iv=crypto.getRandomValues(new Uint8Array(12));let bytes=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},k,enc.encode(data)));let bin='';for(let i=0;i<bytes.length;i+=8192)bin+=String.fromCharCode(...bytes.subarray(i,i+8192));return JSON.stringify({version:2,salt:b64(sa),iv:b64(iv),data:btoa(bin)})}
async function openVault(raw,password){let v=JSON.parse(raw);if(v.version!==2)throw Error('Invalid backup');let sa=un64(v.salt),k=await derive(password,sa);let data=JSON.parse(dec.decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:un64(v.iv)},k,un64(v.data))));return {data,k,sa}}
function gate(){ $('lock').hidden=true;$('nav').innerHTML='';let exists=!!localStorage.getItem(key);$('main').innerHTML=`<section><h2>${exists?'Unlock your sanctuary':'Create your private sanctuary'}</h2><p>${exists?'Enter your password.':'Choose a password of at least 10 characters. There is no password recovery.'}</p><input id="pw" type="password" autocomplete="${exists?'current-password':'new-password'}" placeholder="Password">${exists?'':'<input id="confirmPw" type="password" placeholder="Confirm password">'}<button onclick="unlock()">${exists?'Unlock':'Create vault'}</button><p id="msg" role="status"></p><label>Restore encrypted backup<input type="file" accept=".json" onchange="restoreLocked(this.files[0])"></label></section>`}
async function unlock(){let pw=$('pw').value,raw=localStorage.getItem(key);try{if(!crypto.subtle)throw Error('Open this app over HTTPS in Safari.');if(raw){let v=await openVault(raw,pw);s=v.data;cryptoKey=v.k;salt=v.sa}else{if(pw.length<10||pw!==$('confirmPw').value)throw Error('Use at least 10 characters and matching passwords.');salt=crypto.getRandomValues(new Uint8Array(16));cryptoKey=await derive(pw,salt);s=structuredClone(initial);localStorage.setItem(key,await seal(JSON.stringify(s),cryptoKey,salt))}$('lock').hidden=false;render()}catch(e){$('msg').textContent=raw?'Unable to unlock. Check your password.':e.message}}
async function lockVault(){await queue;s=null;cryptoKey=null;salt=null;tab='Sanctuary';gate()}
async function restoreLocked(f){if(!f)return;let pw=$('pw').value;try{let raw=await f.text();await openVault(raw,pw);if(confirm('Replace the local vault with this backup?')){localStorage.setItem(key,raw);gate();$('msg').textContent='Backup restored. Enter its password to unlock.'}}catch(e){$('msg').textContent='Enter the backup password before selecting a valid encrypted backup.'}}
let tab='Sanctuary';const $=id=>document.getElementById(id);const esc=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function save(){let data=JSON.stringify(s),k=cryptoKey,sa=salt;queue=queue.then(async()=>{localStorage.setItem(key,await seal(data,k,sa))}).catch(()=>alert('Unable to save. Export an encrypted backup before closing.'));return queue}function log(text){s.history.unshift({date:new Date().toLocaleString(),text});save()}function go(t){tab=t;render()}function render(){ $('nav').innerHTML=['Sanctuary','Hearts','Laws','Journal','History','Backup'].map(t=>`<button class="${tab===t?'active':''}" onclick="go('${t}')">${t}</button>`).join('');let h='';if(tab==='Sanctuary'){h=`<section class="center"><div>${s.hearts.map(x=>esc(x.status+' '+x.name)).join('　')}</div><div class="wall" style="border-width:${Math.min(24,6+s.wall*2)}px"><div class="heart">🩵</div><small>INNER PEACE</small></div><h2>Wall of Protection</h2><p>Level ${s.wall}</p><button onclick="wall(-1)">−</button> <button onclick="wall(1)">Strengthen +</button><p>${s.hearts.filter(x=>x.status==='🖤').length} Black Hearts · ${s.hearts.filter(x=>x.warning).length} warnings</p><p><i>They have a place in my heart, but they hold no power over my inner peace. I am in control.</i></p><small>Protect your peace without closing yourself off to connection.</small></section>`}if(tab==='Hearts'){h=s.hearts.map((x,i)=>`<section><h2>${esc(x.status+' '+x.name)}</h2><label>Name<input value="${esc(x.name)}" onchange="edit(${i},'name',this.value)"></label><label>Heart status <select onchange="edit(${i},'status',this.value)">${['🤍','🩶','🖤'].map(v=>`<option ${v===x.status?'selected':''}>${v}</option>`).join('')}</select></label><label><input type="checkbox" ${x.warning?'checked':''} onchange="edit(${i},'warning',this.checked)"> Active warning</label><label>Private notes<textarea onchange="edit(${i},'notes',this.value)">${esc(x.notes)}</textarea></label></section>`).join('')+'<button onclick="addHeart()">Add heart</button>'}if(tab==='Laws'){h='<section><h2>Book of Laws</h2>'+s.laws.map((x,i)=>`<label>${i+1}<textarea onchange="law(${i},this.value)">${esc(x)}</textarea></label>`).join('')+'<button onclick="s.laws.push(\'New law\');log(\'Law added\');render()">Add law</button></section>'}if(tab==='Journal'){h='<section><h2>Private journal</h2><textarea id="entry" placeholder="What is on your mind?"></textarea><button onclick="entry()">Save entry</button></section>'+s.journal.map((x,i)=>`<section><small>${esc(x.date)}</small><p style="white-space:pre-wrap">${esc(x.text)}</p><button onclick="del(${i})">Delete entry</button></section>`).join('')}if(tab==='History'){h='<section><h2>Timeline</h2>'+s.history.map(x=>`<article><small>${esc(x.date)}</small><p>${esc(x.text)}</p></article>`).join('')+'</section>'}if(tab==='Backup'){h='<section><h2>Backup & restore</h2><p>Export an encrypted backup. Your vault password is needed to restore it. Importing replaces your current records.</p><button onclick="backup()">Export backup</button><input type="file" accept=".json" onchange="restore(this.files[0])"></section>'}$('main').innerHTML=h}function wall(n){s.wall=Math.max(1,s.wall+n);log('Wall level changed to '+s.wall);render()}function edit(i,k,v){let old=s.hearts[i][k];s.hearts[i][k]=v;if(k!=='notes')log(s.hearts[i].name+': '+k+' changed from '+old+' to '+v);else save();if(k!=='notes')render()}function addHeart(){let n=prompt('Name');if(n){s.hearts.push({name:n,status:'🤍',warning:false,notes:''});log('Heart added: '+n);render()}}function law(i,v){s.laws[i]=v;log('Law '+(i+1)+' amended')}function entry(){let v=$('entry').value.trim();if(v){s.journal.unshift({date:new Date().toLocaleString(),text:v});save();render()}}function del(i){if(confirm('Delete this entry?')){s.journal.splice(i,1);save();render()}}async function backup(){try{let raw=await seal(JSON.stringify(s),cryptoKey,salt);let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([raw],{type:'application/json'}));a.download='sanctuary-encrypted-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}catch(e){alert('Backup failed.')}}async function restore(f){if(!f)return;let pw=prompt('Password of the backup');if(pw===null)return;try{let v=await openVault(await f.text(),pw);if(!Number.isFinite(v.data.wall)||!['hearts','laws','journal','history'].every(k=>Array.isArray(v.data[k])))throw Error();if(confirm('Replace current records? The backup password becomes your vault password.')){await queue;s=v.data;cryptoKey=v.k;salt=v.sa;await save();render()}}catch(e){alert('Invalid backup or password.')}}try{gate()}catch(e){$('main').textContent='Browser storage unavailable. Open this app in Safari over HTTPS.'}</script></body></html>
